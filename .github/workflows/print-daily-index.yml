name: Print daily index
on:
  workflow_dispatch:
jobs:
  series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-index
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch-prices
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - run: node --experimental-strip-types scripts/print-daily-index.ts 2026-11-10
