name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every 10 minutes, so new Notion quotes and expiry dates reach the site without a push.
  schedule:
    - cron: "*/10 * * * *"
    # Daily rebuild that also re-sends the price pages to IndexNow.
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run fetch-prices
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow feeds Bing (and ChatGPT search through it), Yandex and others.
      # Every push sends the whole sitemap; scheduled rebuilds send the price pages once a day.
      - name: Notify IndexNow
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" != "5 1 * * *" ]; then exit 0; fi
          if [ "$EVENT" = schedule ]; then
            urls='["https://redsearate.com/","https://redsearate.com/zh/","https://redsearate.com/rates/","https://redsearate.com/zh/rates/"]'
          else
            urls=$(curl -fsS https://redsearate.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | jq -R . | jq -sc .)
          fi
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"redsearate.com\",\"key\":\"0780df4f6089aa1190147867ac87b0bc\",\"keyLocation\":\"https://redsearate.com/0780df4f6089aa1190147867ac87b0bc.txt\",\"urlList\":$urls}"
